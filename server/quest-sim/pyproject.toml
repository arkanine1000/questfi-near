[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quest-sim"
version = "0.1.0"
description = "Agent-native dungeon-crawler RPG-lite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "smolagents[toolkit]>=1.24.0",
    "litellm>=1.40.0",
    "sse-starlette>=2.0.0",
    "fastmcp>=2.10,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
